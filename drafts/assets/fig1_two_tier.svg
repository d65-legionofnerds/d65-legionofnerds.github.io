  <!-- Chart area: x=60..680, y=60..340 -->
  <!-- Y axis labels -->
  <text x="52" y="64"  font-size="11" text-anchor="end" fill="#6b6458">60</text>
  <text x="52" y="114" font-size="11" text-anchor="end" fill="#6b6458">50</text>
  <text x="52" y="164" font-size="11" text-anchor="end" fill="#6b6458">40</text>
  <text x="52" y="214" font-size="11" text-anchor="end" fill="#6b6458">30</text>
  <text x="52" y="264" font-size="11" text-anchor="end" fill="#6b6458">20</text>
  <text x="52" y="314" font-size="11" text-anchor="end" fill="#6b6458">10</text>
  <text x="52" y="344" font-size="11" text-anchor="end" fill="#6b6458">0</text>

  <!-- Gridlines -->
  <line x1="60" y1="60"  x2="690" y2="60"  stroke="#ede8dc" stroke-width="1"/>
  <line x1="60" y1="110" x2="690" y2="110" stroke="#ede8dc" stroke-width="1"/>
  <line x1="60" y1="160" x2="690" y2="160" stroke="#ede8dc" stroke-width="1"/>
  <line x1="60" y1="210" x2="690" y2="210" stroke="#ede8dc" stroke-width="1"/>
  <line x1="60" y1="260" x2="690" y2="260" stroke="#ede8dc" stroke-width="1"/>
  <line x1="60" y1="310" x2="690" y2="310" stroke="#ede8dc" stroke-width="1"/>
  <line x1="60" y1="344" x2="690" y2="344" stroke="#1a1a1a" stroke-width="1"/>

  <!-- Data: years at x positions, scale: 0=344, 60=60, so 1 unit = (344-60)/60 = 4.73px
       Years: 2016-17, 2019S, 2020-21, 2021-22, 2022-23, 2025-26
       X positions (6 groups, bar width 60, gap 20): 80,180,280,380,480,580 -->

  <!-- Helper: y = 344 - val*4.733 -->
  <!-- Cabinet values: 8,8,9,10,12,6 -->
  <!-- Sub-cab values: 6,9,20,38,48,42 -->

  <!-- Horton era shading (2019S to 2022-23) -->
  <rect x="163" y="60" width="337" height="284" fill="rgba(0,0,0,0.04)"/>
  <text x="267" y="78" font-size="10" text-anchor="middle" fill="#6b6458" font-style="italic">Horton era</text>

  <!-- Group 1: 2016-17 -->
  <!-- Sub-cab: 6 → h=28.4, y=315.6 -->
  <rect x="70"  y="316" width="28" height="28"  fill="#f09595"/>
  <!-- Cabinet: 8 → h=37.9, y=306.1 — stacked on top -->
  <rect x="70"  y="278" width="28" height="38"  fill="#c0392b"/>
  <text x="84"  y="360" font-size="10" text-anchor="middle" fill="#6b6458">2016–17</text>
  <text x="84"  y="372" font-size="10" text-anchor="middle" fill="#6b6458">Goren</text>

  <!-- Group 2: 2019S -->
  <!-- Sub-cab: 9 → h=42.6, y=301.4 -->
  <rect x="165" y="301" width="28" height="43"  fill="#f09595"/>
  <!-- Cabinet: 8 → h=37.9, y=263.5 -->
  <rect x="165" y="263" width="28" height="38"  fill="#c0392b"/>
  <text x="179" y="360" font-size="10" text-anchor="middle" fill="#6b6458">2019</text>
  <text x="179" y="372" font-size="10" text-anchor="middle" fill="#6b6458">Interim</text>

