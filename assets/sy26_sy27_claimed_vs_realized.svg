<svg xmlns='http://www.w3.org/2000/svg' viewBox='-12 -8 704 400' width='100%' font-family='-apple-system,Segoe UI,Helvetica,Arial,sans-serif' xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata><rect x='-12' y='-8' width='704' height='400' fill='#ffffff'/><text x='0' y='18' font-size='14' font-weight='600' fill='#0d1b2a'>Savings claimed vs. likely realized, per year</text><text x='0' y='38' font-size='12' fill='#3d4f63'>Kingsley and Bessie Rhodes combined. Dot: midpoint of our estimate. Line: likely range. Red, left of $0, is a net cost.</text><line x1='255' x2='255' y1='60' y2='342' stroke='#8696a8' stroke-width='1' stroke-dasharray='3 3'/><text x='255' y='54' text-anchor='middle' font-size='12' fill='#3d4f63'>$0</text><text x='0' y='76' font-size='14' font-weight='600' fill='#0d1b2a'>Staffing</text><text x='0' y='101' font-size='14' fill='#0d1b2a'>Claimed by the District</text><rect x='255' y='84' width='222' height='24' rx='3' fill='#174a87'/><text x='485' y='101' font-size='14' font-weight='600' fill='#0d1b2a'>$2.02M</text><text x='0' y='133' font-size='14' fill='#0d1b2a'>Likely realized</text><line x1='200' x2='255' y1='128' y2='128' stroke='#b42318' stroke-width='3' stroke-linecap='round'/><line x1='255' x2='277' y1='128' y2='128' stroke='#2171b5' stroke-width='3' stroke-linecap='round'/><line x1='200' x2='200' y1='121' y2='135' stroke='#b42318' stroke-width='3' stroke-linecap='round'/><line x1='277' x2='277' y1='121' y2='135' stroke='#2171b5' stroke-width='3' stroke-linecap='round'/><circle cx='238' cy='128' r='6' fill='#b42318' stroke='#ffffff' stroke-width='1.5'/><text x='287' y='133' font-size='14' font-weight='600' fill='#0d1b2a'>$0.5M net cost to $0.2M saving</text><text x='0' y='172' font-size='14' font-weight='600' fill='#0d1b2a'>Building costs</text><text x='0' y='197' font-size='14' fill='#0d1b2a'>Claimed by the District</text><rect x='255' y='180' width='108' height='24' rx='3' fill='#174a87'/><text x='371' y='197' font-size='14' font-weight='600' fill='#0d1b2a'>$0.98M</text><text x='0' y='229' font-size='14' fill='#0d1b2a'>Likely realized</text><line x1='288' x2='310' y1='224' y2='224' stroke='#2171b5' stroke-width='3' stroke-linecap='round'/><line x1='288' x2='288' y1='217' y2='231' stroke='#2171b5' stroke-width='3' stroke-linecap='round'/><line x1='310' x2='310' y1='217' y2='231' stroke='#2171b5' stroke-width='3' stroke-linecap='round'/><circle cx='299' cy='224' r='6' fill='#2171b5' stroke='#ffffff' stroke-width='1.5'/><text x='320' y='229' font-size='14' font-weight='600' fill='#0d1b2a'>$0.3–0.5M</text><text x='0' y='268' font-size='14' font-weight='600' fill='#0d1b2a'>Total</text><text x='0' y='293' font-size='14' fill='#0d1b2a'>Claimed by the District</text><rect x='255' y='276' width='330' height='24' rx='3' fill='#174a87'/><text x='593' y='293' font-size='14' font-weight='600' fill='#0d1b2a'>$3.00M</text><text x='0' y='325' font-size='14' fill='#0d1b2a'>Likely realized</text><line x1='233' x2='255' y1='320' y2='320' stroke='#b42318' stroke-width='3' stroke-linecap='round'/><line x1='255' x2='332' y1='320' y2='320' stroke='#2171b5' stroke-width='3' stroke-linecap='round'/><line x1='233' x2='233' y1='313' y2='327' stroke='#b42318' stroke-width='3' stroke-linecap='round'/><line x1='332' x2='332' y1='313' y2='327' stroke='#2171b5' stroke-width='3' stroke-linecap='round'/><circle cx='282' cy='320' r='6' fill='#2171b5' stroke='#ffffff' stroke-width='1.5'/><text x='342' y='325' font-size='14' font-weight='600' fill='#0d1b2a'>$0.2M net cost to $0.7M saving</text><text x='0' y='358' font-size='12' fill='#3d4f63'>Staffing: cuts visible in the state pay reports and FTE file, minus added assistant principals and custodians. Building: costs that</text><text x='0' y='374' font-size='12' fill='#3d4f63'>stop while the District still owns the buildings (insurance and part of maintenance, utilities and security continue).</text></svg>