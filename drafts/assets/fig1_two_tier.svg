  <!-- Sub-cab: 20 → h=94.7, y=249.3 -->
  <rect x="260" y="249" width="28" height="95"  fill="#f09595"/>
  <!-- Cabinet: 9 → h=42.6, y=206.7 -->
  <rect x="260" y="207" width="28" height="43"  fill="#c0392b"/>
