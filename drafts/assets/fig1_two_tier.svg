  <rect x="355" y="164" width="28" height="180" fill="#f09595"/>
  <!-- Cabinet: 10 → h=47.3, y=116.7 -->
  <rect x="355" y="117" width="28" height="47"  fill="#c0392b"/>
  <text x="369" y="360" font-size="10" text-anchor="middle" fill="#6b6458">2021–22</text>
  <text x="369" y="372" font-size="10" text-anchor="middle" fill="#6b6458">Horton yr 2</text>

  <!-- Group 5: 2022-23 PEAK -->
  <!-- Sub-cab: 48 → h=227.2, y=116.8 -->
  <rect x="450" y="117" width="28" height="227" fill="#f09595"/>
  <!-- Cabinet: 12 → h=56.8, y=60 -->
  <rect x="450" y="60"  width="28" height="57"  fill="#c0392b"/>
  <text x="464" y="360" font-size="10" text-anchor="middle" fill="#6b6458">2022–23</text>
  <text x="464" y="372" font-size="10" text-anchor="middle" fill="#6b6458">Peak</text>

  <!-- Group 6: 2025-26 -->
  <!-- Sub-cab: 42 → h=198.8, y=145.2 -->
  <rect x="545" y="145" width="28" height="199" fill="#f09595" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4,3"/>
  <!-- Cabinet: 6 → h=28.4, y=116.8 -->
  <rect x="545" y="117" width="28" height="28"  fill="#c0392b" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4,3"/>
  <text x="559" y="360" font-size="10" text-anchor="middle" fill="#6b6458">2025–26</text>
  <text x="559" y="372" font-size="10" text-anchor="middle" fill="#6b6458">Post-SDRP</text>

  <!-- Y axis line -->
  <line x1="60" y1="60" x2="60" y2="344" stroke="#1a1a1a" stroke-width="1"/>

  <!-- Y axis title -->
  <text x="16" y="210" font-size="11" fill="#6b6458" transform="rotate(-90,16,210)" text-anchor="middle">Number of Positions</text>

  <!-- Legend -->
  <rect x="60"  y="388" width="12" height="12" fill="#c0392b" rx="2"/>
  <text x="76"  y="399" font-size="11" fill="#1a1a1a">Cabinet</text>
  <rect x="160" y="388" width="12" height="12" fill="#f09595" rx="2"/>
  <text x="176" y="399" font-size="11" fill="#1a1a1a">Sub-cabinet</text>
  <rect x="290" y="388" width="12" height="12" fill="none" stroke="#c0392b" stroke-width="1.5" stroke-dasharray="4,3" rx="2"/>
  <text x="306" y="399" font-size="11" fill="#1a1a1a">Post-SDRP (2025–26)</text>
  <rect x="460" y="388" width="28" height="12" fill="rgba(0,0,0,0.04)" stroke="rgba(80,80,80,0.3)" stroke-dasharray="3,2" rx="2"/>
  <text x="492" y="399" font-size="11" fill="#1a1a1a">Horton era</text>

  <!-- Source -->
  <text x="60" y="416" font-size="10" font-family="'Courier New', monospace" fill="#6b6458">Source: D65 org charts (FOIAGras docs 4479, 3906, 3180), PA 96-0434 TRS Administrator reports. Legion of Data Nerds, 2026.</text>
