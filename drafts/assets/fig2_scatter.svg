<svg width="720" height="420" viewBox="0 0 720 420" xmlns="http://www.w3.org/2000/svg" font-family="Georgia, serif">
  <rect width="720" height="420" fill="white"/>

  <!-- Title bar -->
  <rect width="720" height="44" fill="#1a1a1a"/>
  <text x="16" y="27" font-size="11" font-family="'Courier New', monospace" fill="#f5f0e8" letter-spacing="0.08em">FIG. 2 · ENROLLMENT VS. CENTRAL OFFICE POSITIONS, 2016–17 TO 2025–26</text>

  <!-- Chart area: x=70..680, y=55..330 -->
  <!-- X axis: enrollment 5400–7600, range=2200, width=610, 1 unit=0.2773px -->
  <!-- Y axis: positions 0–60, range=60, height=275, 1 unit=4.583px -->
  <!-- Helper: px = 70 + (enr-5400)*0.2773   py = 330 - pos*4.583 -->

  <!-- Horton era shading (2019S to 2022-23: enr 6019–6977) -->
  <rect x="169" y="55" width="266" height="275" fill="rgba(0,0,0,0.05)"/>
  <text x="302" y="73" font-size="10" text-anchor="middle" fill="#6b6458" font-style="italic">Horton era</text>

  <!-- X gridlines & labels -->
  <line x1="70" y1="330" x2="680" y2="330" stroke="#1a1a1a" stroke-width="1"/>
  <line x1="70" y1="55"  x2="70"  y2="330" stroke="#1a1a1a" stroke-width="1"/>

  <!-- X tick labels (enrollment) -->
  <text x="70"  y="348" font-size="10" text-anchor="middle" fill="#6b6458">5,400</text>
  <text x="181" y="348" font-size="10" text-anchor="middle" fill="#6b6458">5,800</text>
  <text x="292" y="348" font-size="10" text-anchor="middle" fill="#6b6458">6,200</text>
  <text x="403" y="348" font-size="10" text-anchor="middle" fill="#6b6458">6,600</text>
  <text x="514" y="348" font-size="10" text-anchor="middle" fill="#6b6458">7,000</text>
  <text x="625" y="348" font-size="10" text-anchor="middle" fill="#6b6458">7,400</text>
  <text x="375" y="368" font-size="11" text-anchor="middle" fill="#6b6458">Enrollment</text>

  <!-- X gridlines -->
  <line x1="181" y1="55" x2="181" y2="330" stroke="#ede8dc" stroke-width="1"/>
  <line x1="292" y1="55" x2="292" y2="330" stroke="#ede8dc" stroke-width="1"/>
  <line x1="403" y1="55" x2="403" y2="330" stroke="#ede8dc" stroke-width="1"/>
  <line x1="514" y1="55" x2="514" y2="330" stroke="#ede8dc" stroke-width="1"/>
  <line x1="625" y1="55" x2="625" y2="330" stroke="#ede8dc" stroke-width="1"/>

  <!-- Y tick labels (positions) -->
  <text x="62" y="330" font-size="10" text-anchor="end" fill="#6b6458">0</text>
  <text x="62" y="284" font-size="10" text-anchor="end" fill="#6b6458">10</text>
  <text x="62" y="238" font-size="10" text-anchor="end" fill="#6b6458">20</text>
  <text x="62" y="192" font-size="10" text-anchor="end" fill="#6b6458">30</text>
  <text x="62" y="146" font-size="10" text-anchor="end" fill="#6b6458">40</text>
  <text x="62" y="100" font-size="10" text-anchor="end" fill="#6b6458">50</text>
  <text x="62" y="55"  font-size="10" text-anchor="end" fill="#6b6458">60</text>

  <!-- Y gridlines -->
  <line x1="70" y1="284" x2="680" y2="284" stroke="#ede8dc" stroke-width="1"/>
  <line x1="70" y1="238" x2="680" y2="238" stroke="#ede8dc" stroke-width="1"/>
  <line x1="70" y1="192" x2="680" y2="192" stroke="#ede8dc" stroke-width="1"/>
  <line x1="70" y1="146" x2="680" y2="146" stroke="#ede8dc" stroke-width="1"/>
  <line x1="70" y1="100" x2="680" y2="100" stroke="#ede8dc" stroke-width="1"/>

  <!-- Y axis title -->
  <text x="16" y="195" font-size="11" fill="#6b6458" transform="rotate(-90,16,195)" text-anchor="middle">Total Admin Positions</text>

  <!-- Data points: px=70+(enr-5400)*0.2773  py=330-total*4.583
       2016-17: enr=7422 total=14  px=353 py=266  → px=70+(7422-5400)*0.2773=70+560.8=631  py=330-14*4.583=330-64.2=266
       2019S:   enr=6977 total=17  px=70+(6977-5400)*0.2773=70+437.4=507  py=330-17*4.583=330-77.9=252
       2020-21: enr=6497 total=29  px=70+(6497-5400)*0.2773=70+304.3=374  py=330-29*4.583=330-132.9=197
       2021-22: enr=6116 total=48  px=70+(6116-5400)*0.2773=70+198.6=269  py=330-48*4.583=330-220=110
       2022-23: enr=6019 total=60  px=70+(6019-5400)*0.2773=70+171.7=242  py=330-60*4.583=330-275=55
       2025-26: enr=5567 total=48  px=70+(5567-5400)*0.2773=70+46.3=116   py=330-48*4.583=330-220=110
  -->

  <!-- Cabinet dots (red) -->
  <circle cx="631" cy="293" r="7" fill="#c0392b"/><!-- 2016-17 cab=8 py=330-36.7=293 -->
  <circle cx="507" cy="293" r="7" fill="#c0392b"/><!-- 2019S cab=8 -->
  <circle cx="374" cy="289" r="7" fill="#c0392b"/><!-- 2020-21 cab=9 py=330-41.2=289 -->
  <circle cx="269" cy="284" r="7" fill="#c0392b"/><!-- 2021-22 cab=10 py=330-45.8=284 -->
  <circle cx="242" cy="275" r="7" fill="#c0392b"/><!-- 2022-23 cab=12 py=330-55=275 -->
  <circle cx="116" cy="302" r="7" fill="#c0392b" stroke="#c0392b" stroke-dasharray="3,2" stroke-width="1.5"/><!-- 2025-26 cab=6 py=330-27.5=302 -->

  <!-- Sub-cabinet dots (light red) -->
  <circle cx="631" cy="302" r="7" fill="#f09595"/><!-- 2016-17 sub=6 py=330-27.5=302 -->
  <circle cx="507" cy="289" r="7" fill="#f09595"/><!-- 2019S sub=9 py=330-41.2=289 -->
  <circle cx="374" cy="238" r="7" fill="#f09595"/><!-- 2020-21 sub=20 py=330-91.7=238 -->
  <circle cx="269" cy="156" r="7" fill="#f09595"/><!-- 2021-22 sub=38 py=330-174.2=156 -->
  <circle cx="242" cy="55"  r="7" fill="#f09595"/><!-- 2022-23 sub=48 py=55 -->
  <circle cx="116" cy="110" r="7" fill="#f09595" stroke="#c0392b" stroke-dasharray="3,2" stroke-width="1.5"/><!-- 2025-26 sub=42 py=330-192.5=138 -->

  <!-- Total dots (dark) -->
  <circle cx="631" cy="266" r="5" fill="#1a1a1a"/>
  <circle cx="507" cy="252" r="5" fill="#1a1a1a"/>
  <circle cx="374" cy="197" r="5" fill="#1a1a1a"/>
  <circle cx="269" cy="110" r="5" fill="#1a1a1a"/>
  <circle cx="242" cy="55"  r="5" fill="#1a1a1a"/>
  <circle cx="116" cy="110" r="5" fill="#1a1a1a"/>

  <!-- Year labels -->
  <text x="631" y="308" font-size="9" text-anchor="middle" fill="#6b6458">2016–17</text>
  <text x="507" y="270" font-size="9" text-anchor="middle" fill="#6b6458">2019</text>
  <text x="374" y="180" font-size="9" text-anchor="middle" fill="#6b6458">2020–21</text>
  <text x="269" y="95"  font-size="9" text-anchor="middle" fill="#6b6458">2021–22</text>
  <text x="218" y="52"  font-size="9" text-anchor="middle" fill="#6b6458">2022–23 peak</text>
  <text x="116" y="98"  font-size="9" text-anchor="middle" fill="#6b6458">2025–26</text>

  <!-- Trend arrow annotation -->
  <text x="400" y="130" font-size="11" fill="#c0392b" font-style="italic">Admin grew as enrollment fell</text>

  <!-- Legend -->
  <circle cx="72" cy="393" r="6" fill="#c0392b"/>
  <text x="84" y="397" font-size="11" fill="#1a1a1a">Cabinet</text>
  <circle cx="160" cy="393" r="6" fill="#f09595"/>
  <text x="172" y="397" font-size="11" fill="#1a1a1a">Sub-cabinet</text>
  <circle cx="270" cy="393" r="5" fill="#1a1a1a"/>
  <text x="282" y="397" font-size="11" fill="#1a1a1a">Total</text>
  <rect x="340" y="387" width="24" height="12" fill="rgba(0,0,0,0.05)" rx="2"/>
  <text x="370" y="397" font-size="11" fill="#1a1a1a">Horton era</text>

  <!-- Source -->
  <text x="60" y="416" font-size="10" font-family="'Courier New', monospace" fill="#6b6458">Source: ISBE enrollment data, D65 org charts, PA 96-0434. Legion of Data Nerds, 2026.</text>
</svg>
